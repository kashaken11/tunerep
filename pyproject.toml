[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kashaken11-tunerep"
version = "0.1.0"
description = "在同一个输入里两两比对，检测微调数据的重复样本相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kashaken11" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kashaken11.github.io"
Repository = "https://github.com/kashaken11/tunerep"
Issues = "https://github.com/kashaken11/tunerep/issues"

[project.scripts]
tunerep = "tunerep:main"

[tool.setuptools]
py-modules = ["tunerep"]
